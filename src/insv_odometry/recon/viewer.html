<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INSV 3D Viewer</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #2a2f3a; --text: #e6e8ee; --muted: #9aa3b2;
    --accent: #ff8a3d; --accent2: #3dc8ff; --ok: #7bd88f; --warn: #ffd166;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .stats { color: var(--muted); font-size: 13px; display: flex; gap: 14px; flex-wrap: wrap; }
  header .stats b { color: var(--text); font-weight: 600; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px 16px;
    height: calc(100% - 50px); min-height: 0; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .panel .title { display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 13px; gap: 8px; }
  .panel .title strong { color: var(--text); font-weight: 600; }
  .videowrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #000; min-height: 0; }
  video { width: 100%; max-height: 100%; display: block; }
  #three { flex: 1; position: relative; min-height: 0; }
  #three canvas { display: block; width: 100%; height: 100%; }
  .legend { position: absolute; left: 10px; bottom: 10px; background: rgba(15,17,21,.8);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button, select { background: #222734; color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  button.on { border-color: var(--accent); color: var(--accent); }
  input[type=range] { width: 90px; accent-color: var(--accent); }
  .hud { padding: 8px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px;
    display: flex; gap: 16px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
  .hud b { color: var(--text); font-weight: 600; }
  .err { padding: 24px; color: var(--warn); }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; height: auto; }
    #three { height: 60vh; flex: none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <h1>INSV video ↔ 3D reconstruction</h1>
  <div class="stats" id="stats"></div>
</header>
<main>
  <section class="panel">
    <div class="title"><strong>360° video</strong><span>levelled &amp; world-locked · centre = <span style="color:var(--warn)">yellow arrow</span></span></div>
    <div class="videowrap"><video id="video" src="video.mp4" controls muted playsinline preload="auto"></video></div>
    <div class="hud" id="hud"></div>
  </section>
  <section class="panel">
    <div class="title">
      <strong>Sparse cloud + camera path (metres, Z up)</strong>
      <div class="controls">
        <button id="follow" class="on" title="chase the camera">Follow</button>
        <button id="top" title="top-down view">Top</button>
        <label title="point size">pts <input id="psize" type="range" min="0.01" max="0.12" step="0.005" value="0.04"></label>
      </div>
    </div>
    <div id="three">
      <div class="legend">
        <div><span style="background:var(--accent)"></span>lens 0 (front) frustum</div>
        <div><span style="background:var(--accent2)"></span>lens 1 (back) frustum</div>
        <div><span style="background:#ff4d6d"></span>path travelled · <span style="background:#555"></span>remaining</div>
        <div><span style="background:var(--warn)"></span>video centre direction</div>
      </div>
    </div>
  </section>
</main>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (id) => document.getElementById(id);
let data, n;
try {
  data = await (await fetch("poses.json")).json();
  n = data.t.length;
} catch (e) {
  document.querySelector("main").innerHTML =
    `<div class="err">Could not load poses.json. Serve this folder over HTTP, e.g.<br>
     <code>uv run insv-odometry serve &lt;this folder&gt;</code></div>`;
  throw e;
}
const info = data.info;
$("stats").innerHTML = `<span>${info.camera}</span>
  <span>path <b>${info.path_length_m.toFixed(1)} m</b></span>
  <span>frames <b>${info.registered_frames}</b> SfM keyframes</span>
  <span>IMU scale <b>${info.scale.toFixed(3)}</b></span>
  <span>sync <b>${info.time_offset_ms.toFixed(1)} ms</b></span>`;

// ---------- scene ----------
const host = $("three");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
host.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1115);
const cam = new THREE.PerspectiveCamera(60, 1, 0.05, 500);
cam.up.set(0, 0, 1);
const controls = new OrbitControls(cam, renderer.domElement);
controls.enableDamping = true;

// point cloud
const buf = await (await fetch("cloud.bin")).arrayBuffer();
const np = data.num_points;
const pos = new Float32Array(buf, 0, np * 3);
const col = new Uint8Array(buf, np * 12, np * 3);
const g = new THREE.BufferGeometry();
g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
g.setAttribute("color", new THREE.BufferAttribute(col, 3, true));
const pmat = new THREE.PointsMaterial({ size: 0.04, vertexColors: true, sizeAttenuation: true });
scene.add(new THREE.Points(g, pmat));

// ground grid at fitted ground height
const grid = new THREE.GridHelper(40, 40, 0x3a4150, 0x252a35);
grid.rotation.x = Math.PI / 2;
const c0 = data.p[Math.floor(n / 2)];
grid.position.set(c0[0], c0[1], data.ground_z);
scene.add(grid);

// trajectory: full (dim) + travelled (bright)
const tpos = new Float32Array(data.p.flat());
const mkLine = (color, opacity) => {
  const lg = new THREE.BufferGeometry();
  lg.setAttribute("position", new THREE.BufferAttribute(tpos, 3));
  return new THREE.Line(lg, new THREE.LineBasicMaterial({ color, transparent: true, opacity }));
};
scene.add(mkLine(0x555555, 0.9));
const done = mkLine(0xff4d6d, 1.0);
done.material.linewidth = 2;
scene.add(done);

// keyframe dots
const kf = data.keyframe_times.map((t) => data.p[nearest(t)]);
const kg = new THREE.BufferGeometry();
kg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(kf.flat()), 3));
scene.add(new THREE.Points(kg, new THREE.PointsMaterial({ size: 0.06, color: 0xff4d6d })));

// camera rig marker (OpenCV camera frame: x right, y down, z forward)
const rig = new THREE.Group();
const frustum = (color, sign) => {
  const s = 0.18, d = 0.3 * sign;
  const P = [[0, 0, 0], [-s, -s, d], [s, -s, d], [s, s, d], [-s, s, d]];
  const E = [[0, 1], [0, 2], [0, 3], [0, 4], [1, 2], [2, 3], [3, 4], [4, 1]];
  const v = new Float32Array(E.flatMap(([a, b]) => [...P[a], ...P[b]]));
  const fg = new THREE.BufferGeometry();
  fg.setAttribute("position", new THREE.BufferAttribute(v, 3));
  return new THREE.LineSegments(fg, new THREE.LineBasicMaterial({ color }));
};
rig.add(frustum(0xff8a3d, 1));
rig.add(frustum(0x3dc8ff, -1));
rig.add(new THREE.Mesh(new THREE.SphereGeometry(0.05, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffffff })));
// "up" tick in camera frame (-y)
scene.add(rig);

// video centre arrow (fixed world yaw), attached at the camera position
const yaw = data.video_centre_yaw;
const arrow = new THREE.ArrowHelper(new THREE.Vector3(Math.cos(yaw), Math.sin(yaw), 0),
  new THREE.Vector3(), 0.8, 0xffd166, 0.18, 0.1);
scene.add(arrow);

// initial view
const bb = new THREE.Box3().setFromArray(tpos);
const ctr = bb.getCenter(new THREE.Vector3());
controls.target.copy(ctr);
cam.position.set(ctr.x - 6, ctr.y - 6, ctr.z + 6);

// ---------- sync ----------
const video = $("video");
let idx = 0, mode = "follow";
function nearest(t) {
  let lo = 0, hi = data.t.length - 1;
  while (lo < hi) { const m = (lo + hi) >> 1; if (data.t[m] < t) lo = m + 1; else hi = m; }
  if (lo > 0 && Math.abs(data.t[lo - 1] - t) < Math.abs(data.t[lo] - t)) lo--;
  return lo;
}
function setFrame(i) {
  idx = Math.max(0, Math.min(n - 1, i));
  const p = data.p[idx], q = data.q[idx];
  rig.position.set(p[0], p[1], p[2]);
  rig.quaternion.set(q[0], q[1], q[2], q[3]);
  arrow.position.set(p[0], p[1], p[2]);
  done.geometry.setDrawRange(0, idx + 1);
  const isKey = data.keyframe_times.some((t) => Math.abs(t - data.t[idx]) < 0.017);
  $("hud").innerHTML = `<span>t <b>${data.t[idx].toFixed(2)} s</b></span>
    <span>frame <b>${idx}</b>${isKey ? ' <span style="color:var(--ok)">SfM keyframe</span>' : ' <span>gyro-interpolated</span>'}</span>
    <span>x <b>${p[0].toFixed(2)}</b> y <b>${p[1].toFixed(2)}</b> m</span>
    <span>height <b>${(p[2] - data.ground_z).toFixed(2)} m</b> above ground</span>`;
}
if ("requestVideoFrameCallback" in HTMLVideoElement.prototype) {
  const onFrame = (_, meta) => { setFrame(nearest(meta.mediaTime)); video.requestVideoFrameCallback(onFrame); };
  video.requestVideoFrameCallback(onFrame);
}
video.addEventListener("seeked", () => setFrame(nearest(video.currentTime)));
video.addEventListener("timeupdate", () => { if (video.paused) setFrame(nearest(video.currentTime)); });
setFrame(0);

// ---------- view modes ----------
const btnF = $("follow"), btnT = $("top");
btnF.onclick = () => { mode = mode === "follow" ? "orbit" : "follow"; btnF.classList.toggle("on", mode === "follow"); };
btnT.onclick = () => {
  mode = "orbit"; btnF.classList.remove("on");
  controls.target.copy(ctr); cam.position.set(ctr.x, ctr.y - 0.01, ctr.z + 16);
};
$("psize").oninput = (e) => { pmat.size = +e.target.value; };
renderer.domElement.addEventListener("pointerdown", () => {
  if (mode === "follow") { mode = "orbit"; btnF.classList.remove("on"); }
});

const tmp = new THREE.Vector3(), want = new THREE.Vector3();
function chase() {
  const a = data.p[Math.max(0, idx - 15)], b = data.p[Math.min(n - 1, idx + 15)];
  let dx = b[0] - a[0], dy = b[1] - a[1];
  const L = Math.hypot(dx, dy);
  if (L < 0.05) { dx = Math.cos(yaw); dy = Math.sin(yaw); } else { dx /= L; dy /= L; }
  const p = data.p[idx];
  want.set(p[0] - 3.2 * dx, p[1] - 3.2 * dy, p[2] + 2.0);
  cam.position.lerp(want, 0.08);
  controls.target.lerp(tmp.set(p[0] + dx, p[1] + dy, p[2] - 0.3), 0.12);
}

function resize() {
  const w = host.clientWidth, h = host.clientHeight;
  renderer.setSize(w, h, false);
  cam.aspect = w / Math.max(h, 1);
  cam.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(host);
resize();
(function loop() {
  if (!("requestVideoFrameCallback" in HTMLVideoElement.prototype) && !video.paused) setFrame(nearest(video.currentTime));
  if (mode === "follow") chase();
  controls.update();
  renderer.render(scene, cam);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
